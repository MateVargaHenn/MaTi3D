server {
    listen 80;
    server_name _;
    client_max_body_size 100m;
    absolute_redirect off;

    # Only the host Nginx can reach the loopback-published gateway externally.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_set_header X-Real-IP $http_x_real_ip;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Port "";
    proxy_set_header X-Forwarded-Prefix "";

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /admin\nDisallow: /api\n";
    }
    location = /api { return 308 /api/; }
    location = /api/admin { return 308 /api/admin/; }
    location /api/admin/ {
        auth_basic "MaTi3D admin";
        auth_basic_user_file /etc/nginx/admin.htpasswd;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        proxy_pass http://backend:8080;
    }
    location /api/ {
        proxy_pass http://backend:8080;
    }
    location = /admin { return 308 /admin/; }
    location /admin/ {
        auth_basic "MaTi3D admin";
        auth_basic_user_file /etc/nginx/admin.htpasswd;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        proxy_pass http://admin/;
    }
    location / {
        proxy_pass http://frontend:4000;
    }
}
