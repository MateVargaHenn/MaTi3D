name: mati3d-production

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mati3d}
      POSTGRES_USER: ${POSTGRES_USER:-mati3d}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [application]

  backend:
    build:
      context: ../backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ReverseProxy__KnownProxy: ${GATEWAY_IP:-172.30.33.10}
      ConnectionStrings__mati3d: Host=postgres;Port=5432;Database=${POSTGRES_DB:-mati3d};Username=${POSTGRES_USER:-mati3d};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080; printf 'GET /api/health HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3; grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [application]

  frontend:
    build:
      context: ../frontend
      target: public
    restart: unless-stopped
    environment:
      NG_ALLOWED_HOSTS: ${SITE_HOST:?Set SITE_HOST},www.${SITE_HOST},localhost,127.0.0.1
      NG_TRUST_PROXY_HEADERS: X-Forwarded-Proto
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [application]

  admin:
    build:
      context: ../frontend
      target: admin
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [application]

  gateway:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GATEWAY_HTTP_PORT:-18081}:80"
    volumes:
      - ./gateway.nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./admin.htpasswd:/etc/nginx/admin.htpasswd:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
      admin:
        condition: service_healthy
    networks:
      application:
        ipv4_address: ${GATEWAY_IP:-172.30.33.10}

networks:
  application:
    ipam:
      config:
        - subnet: ${DEPLOY_SUBNET:-172.30.33.0/24}

volumes:
  postgres-data:
